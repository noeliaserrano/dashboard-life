<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Pared de Pósits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c1814">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: una pared de corcho oscura y cálida. Los pósits se agrupan por semana, la más antigua arriba,
   igual que en papel: un color por semana para ver qué llevas más tiempo dejando. Tema oscuro único, a propósito. */
:root {
  color-scheme: dark;
  --wall: #1c1814; --wall-2: #25201b; --line: #3a322a;
  --ink: #f2e9dd; --muted: #a99a89; --faint: #7b6e61;
  --note-ink: #2a2218; --note-ink-soft: rgba(42,34,24,.62);
  --accent: #f0b877; --accent-ink: #2a1c0e; --warn: #f29a86;
  --f-display: "Young Serif", Georgia, serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--wall); color: var(--ink); font: 16px/1.5 var(--f-body);
  background-image: radial-gradient(rgba(255,255,255,.025) 1px, transparent 1px); background-size: 6px 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(40px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; }
h1, h2 { margin: 0; font-family: var(--f-display); font-weight: 400; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(30px, 8vw, 40px); }
h2 { font-size: 20px; }
p { margin: 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 800; }
.muted { color: var(--muted); } .small { font-size: 14px; } .xs { font-size: 13px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { border: 1px solid var(--line); background: var(--wall-2); border-radius: 999px; padding: 8px 15px; font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 5px 12px; font-size: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.head { display: grid; gap: 8px; }
.summary { font-size: 17px; color: var(--muted); }
.summary b { color: var(--ink); }
.swatch { display: inline-block; width: 18px; height: 18px; border-radius: 4px; vertical-align: -3px; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.week-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--wall-2); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 700; }
.picker { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.picker button { width: 40px; height: 40px; border-radius: 8px; border: 2px solid transparent; background: var(--c); }
.picker button[aria-pressed="true"] { border-color: var(--ink); }

.compose { background: var(--wall-2); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 10px; }
.compose-row { display: flex; gap: 8px; }
.compose input[type=text] { flex: 1; min-width: 0; background: var(--wall); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 17px; height: 50px; }
.compose .add { height: 50px; padding: 0 18px; border-radius: 12px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--wall); border-color: var(--ink); }
.date-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 0 4px 0 12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.date-chip input { -webkit-appearance: none; appearance: none; background: none; border: 0; color: var(--ink); padding: 4px 6px; height: 32px; min-width: 0; max-width: 150px; }
.hint { font-size: 13px; color: var(--faint); min-height: 18px; }

.soon { display: grid; gap: 6px; }
.soon-row { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.soon-row .d { font-weight: 800; color: var(--accent); min-width: 84px; font-size: 14px; }
.soon-row .d.late { color: var(--warn); }
.soon-row .t { min-width: 0; overflow-wrap: anywhere; }
.soon-row .swatch { width: 12px; height: 12px; flex: none; }

.week { display: grid; gap: 12px; }
.week-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.week-head h2 { font-size: 19px; }
.age { font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--wall-2); color: var(--muted); }
.age.old { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.notes { display: grid; gap: 6px; }
.note { --note-ink: var(--ink); --note-ink-soft: var(--muted);
  position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 10px;
  padding: 10px 12px 10px 14px; border: 0; border-left: 6px solid var(--c); border-radius: 8px; text-align: left; cursor: pointer;
  background: color-mix(in srgb, var(--c) 9%, var(--wall-2)); color: var(--ink);
  transition: transform .25s ease, opacity .3s ease, background .2s; }
.note:hover { background: color-mix(in srgb, var(--c) 16%, var(--wall-2)); }
.note .txt { font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; min-width: 0; }
.note .meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; font-weight: 800; color: var(--muted); }
.note .meta span { white-space: nowrap; }
.note .meta .due { color: var(--accent); }
.note .meta .due-late { color: var(--warn); }
.note.peel { transform: translateX(60px); opacity: 0; }
.note.open { grid-template-columns: 1fr; cursor: default; background: color-mix(in srgb, var(--c) 14%, var(--wall-2)); }
.note.open .meta { justify-content: flex-start; }
.note-actions { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 6px; }
.note-actions button { border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-weight: 800; font-size: 14px; background: var(--wall); color: var(--ink); }
.note-actions .done { background: var(--c); color: #2a2218; border-color: var(--c); }
.note textarea, .note input[type=date] { width: 100%; background: var(--wall); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.note textarea { font-size: 16px; line-height: 1.35; min-height: 70px; resize: vertical; }
.note input[type=date] { -webkit-appearance: none; appearance: none; display: block; height: 40px; max-width: 220px; }
.note .lbl { font-size: 13px; font-weight: 800; color: var(--muted); display: grid; gap: 4px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* hoy toca */
.todaybox { background: var(--wall-2); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.todaybox h2 { font-size: 21px; }
.steprow { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.steprow .what { font-weight: 700; overflow-wrap: anywhere; }
.steprow .why { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.steprow.late .why b { color: var(--warn); }
.steprow.done .what { text-decoration: line-through; color: var(--muted); }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--c, var(--accent)); background: none; display: grid; place-items: center; padding: 0; color: #2a2218; font-weight: 900; font-size: 15px; }
.check[aria-pressed="true"] { background: var(--c, var(--accent)); }
.check.sm { width: 24px; height: 24px; font-size: 12px; }
.calm { font-size: 14px; color: var(--muted); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* exámenes y entregas */
.plans { display: grid; gap: 10px; }
.plan { background: var(--wall-2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.plan-head { width: 100%; background: none; border: 0; text-align: left; padding: 14px 16px; display: grid; gap: 6px; }
.plan-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
.plan-title { font-weight: 800; font-size: 16px; overflow-wrap: anywhere; min-width: 0; }
.pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: #a8dc96; background: rgba(168,220,150,.14); }
.pill.late { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
.pill.tight { color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
.plan-sub { font-size: 13px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; }
.plan-sub b { color: var(--ink); }
.bar { height: 6px; border-radius: 99px; background: var(--wall); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.plan-body { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: grid; gap: 10px; }
.pstep { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 15px; }
.pstep .d { font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.pstep .d.today { color: var(--accent); } .pstep .d.late { color: var(--warn); }
.pstep.done .n { text-decoration: line-through; color: var(--muted); }
.pedit { display: grid; grid-template-columns: 1fr 150px auto; gap: 6px; align-items: center; }
.pedit input { background: var(--wall); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; height: 38px; min-width: 0; width: 100%; }
.pedit input[type=date] { -webkit-appearance: none; appearance: none; display: block; }
@media (max-width: 420px) { .pedit { grid-template-columns: 1fr auto; } .pedit input[type=date] { grid-column: 1; } }
.x { border: 0; background: none; color: var(--faint); font-size: 16px; padding: 4px 8px; }
.method { font-size: 13px; color: var(--muted); background: var(--wall); border-radius: 10px; padding: 10px 12px; }
.empty { border: 2px dashed var(--line); border-radius: 18px; padding: 28px 18px; text-align: center; color: var(--muted); display: grid; gap: 6px; }
.empty b { font-family: var(--f-display); font-weight: 400; font-size: 20px; color: var(--ink); }

.donebox { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 10px; }
.donebox summary { cursor: pointer; font-weight: 800; color: var(--muted); }
.done-row { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--muted); }
.done-row .t { flex: 1; min-width: 0; text-decoration: line-through; overflow-wrap: anywhere; }
.done-row .swatch { width: 12px; height: 12px; flex: none; }
.big-count { font-family: var(--f-display); font-size: 28px; color: var(--accent); }

.sample { background: var(--wall-2); border: 1px dashed var(--accent); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 15px; }
.foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding-top: 10px; }
.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--wall); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 15px; width: max-content; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); display: flex; gap: 12px; align-items: center; }
.toast button { background: none; border: 0; color: inherit; font-weight: 800; text-decoration: underline; padding: 0; }

@media (prefers-reduced-motion: reduce) { .note { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="label" id="today"></div>
    <h1>Tu pared</h1>
    <p class="summary" id="summary"></p>
    <div><button class="week-btn" type="button" id="weekBtn"></button></div>
    <div class="picker" id="picker" hidden></div>
  </header>

  <div class="sample" id="sample" hidden>
    <span>Estos pósits son de ejemplo, para que veas cómo queda.</span>
    <button class="btn sm" type="button" id="clearSample">Quitar ejemplos</button>
  </div>

  <section class="todaybox" id="todayBox" hidden></section>

  <form class="compose" id="compose" autocomplete="off">
    <div class="compose-row">
      <input type="text" id="text" placeholder="Escribe un pósit…" aria-label="Texto del pósit" enterkeyhint="done">
      <button class="btn primary add" type="submit">Pegar</button>
    </div>
    <div class="opts" id="opts">
      <button type="button" class="chip" data-area="uni" aria-pressed="false">Uni</button>
      <button type="button" class="chip" data-area="work" aria-pressed="false">Trabajo</button>
      <button type="button" class="chip" data-area="tfg" aria-pressed="false">TFG</button>
      <button type="button" class="chip" data-area="life" aria-pressed="false">Personal</button>
      <label class="date-chip">Fecha <input type="date" id="due" aria-label="Fecha límite (opcional)"></label>
    </div>
    <p class="hint" id="hint">Escribe una tarea, o un examen o entrega con su fecha y te hago un plan. También puedes pegar un aviso del campus virtual.</p>
  </form>

  <section class="plans" id="plans" hidden></section>

  <section class="soon" id="soon" hidden></section>

  <div class="chips" id="filter" hidden></div>

  <section id="wall" style="display:grid;gap:28px"></section>

  <section class="donebox" id="donebox"></section>

  <div class="foot">
    <button class="btn sm" type="button" id="exportBtn">Guardar copia</button>
    <label class="btn sm" for="importFile">Recuperar copia</label>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  const KEY = "mi-pared-posits-v3";
  const OLD_KEY = "mi-dia-tranquilo-v2";
  const COLORS = [
    { name: "amarillo", c: "#f6dc6b" }, { name: "rosa", c: "#f5a6c1" }, { name: "verde", c: "#a8dc96" },
    { name: "azul", c: "#97cbee" }, { name: "naranja", c: "#f7b46f" }, { name: "lila", c: "#c6aff0" }
  ];
  const AREA = { uni: "Uni", work: "Trabajo", tfg: "TFG", life: "Personal" };
  const DOW = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const DOWL = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const MON = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  const MONL = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const today = () => iso(new Date());
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const diff = (s) => Math.round((parse(s) - parse(today())) / 86400000);
  const fmt = (s) => { const d = parse(s); return DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; };
  const monday = (s) => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
  const weeksBetween = (a, b) => Math.round((parse(b) - parse(a)) / (7 * 86400000));
  const weeksAgo = (wk) => weeksBetween(wk, monday(today()));
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const cap1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const rot = (id) => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) | 0; return ((Math.abs(h) % 7) - 3) * 0.7; };

  // ---------- estado ----------
  function sampleState() {
    const w0 = monday(today()), w1 = addDays(w0, -7), w2 = addDays(w0, -14), w3 = addDays(w0, -21);
    const n = (text, week, extra) => Object.assign({ id: uid(), text, week, created: week, area: null, due: null, done: false }, extra || {});
    return {
      v: 3, sample: true,
      weekColor: { [w3]: 0, [w2]: 1, [w1]: 2, [w0]: 3 },
      notes: [
        n("Pedir cita con la tutora del TFG", w3, { area: "tfg" }),
        n("Buscar bibliografía del estado del arte", w2, { area: "tfg" }),
        n("Renovar el seguro de la bici", w2, { area: "life" }),
        n("Práctica 3 de Bases de Datos", w1, { area: "uni", due: addDays(today(), 3) }),
        n("Informe mensual", w1, { area: "work", due: addDays(today(), 6) }),
        n("Examen parcial de Estadística", w0, { area: "uni", due: addDays(today(), 9) }),
        n("Pagar el recibo del gimnasio", w0, { area: "life", due: addDays(today(), 2) }),
        n("Comprar pienso", w0, { area: "life" }),
        n("Revisar cuadro de turnos", w0, { area: "work" }),
        n("Llamar al veterinario", w1, { area: "life", done: true, doneAt: today() }),
        n("Entregar ejercicios del tema 2", w0, { area: "uni", done: true, doneAt: today() })
      ]
    };
  }
  // Si usaste la versión anterior, sus plazos pendientes pasan a ser pósits de esta semana.
  function migrateOld() {
    try {
      const old = JSON.parse(localStorage.getItem(OLD_KEY));
      if (!old || old.sample || !Array.isArray(old.deadlines)) return null;
      const w0 = monday(today()), notes = [];
      const add = (text, area, due) => notes.push({ id: uid(), text, week: w0, created: today(), area: area || null, due: due || null, done: false });
      old.deadlines.filter((d) => !d.done).forEach((d) => add(d.title, ["uni", "work", "tfg"].includes(d.area) ? d.area : null, d.date));
      (old.tasks || []).filter((t) => !t.done).forEach((t) => add(t.title));
      (old.inbox || []).forEach((t) => add(t.text));
      return notes.length ? { v: 3, sample: false, weekColor: {}, notes } : null;
    } catch (e) { return null; }
  }
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || state.v !== 3) state = migrateOld() || sampleState();
  if (!Array.isArray(state.plans)) state.plans = [];
  // Los exámenes y entregas que ya tenías como líneas pasan a tener su plan.
  function migratePlans() { if (!state.plansV) {
    state.notes.filter((n) => !n.done && n.due && n.area !== "life" && isDeadline(n.text)).forEach((n) => {
      const p = makePlan(n.text, n.due, n.area || "uni"); state.plans.push(p); n.done = true; n.tossed = true; n.doneAt = today();
    });
    if (state.sample && state.plans.length) { const st = state.plans.sort((x, y) => x.due.localeCompare(y.due))[0].steps[0]; st.day = addDays(today(), -1); }
    state.plansV = 1; save();
  } }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // Cada semana nueva coge el siguiente color de la rueda. Se puede cambiar a mano.
  function colorIdx(wk) {
    if (state.weekColor[wk] != null) return state.weekColor[wk];
    const known = Object.keys(state.weekColor).filter((k) => k < wk).sort();
    const last = known[known.length - 1];
    const idx = last ? (state.weekColor[last] + weeksBetween(last, wk)) % COLORS.length : 0;
    state.weekColor[wk] = idx; save();
    return idx;
  }
  const colorOf = (wk) => COLORS[colorIdx(wk)];

  // ---------- entender fechas y áreas en lo que escribes ----------
  const WD = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
  const MN = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  function guess(text) {
    const n = norm(text), t = today(); let due = null, area = null, m;
    if (/\bpasado manana\b/.test(n)) due = addDays(t, 2);
    else if (/\bmanana\b/.test(n)) due = addDays(t, 1);
    else if (/\bhoy\b/.test(n)) due = t;
    else if ((m = n.match(/\ben (\d+) dias?\b/))) due = addDays(t, +m[1]);
    else if ((m = n.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/)) && +m[2] >= 1 && +m[2] <= 12) {
      let y = m[3] ? +m[3] : parse(t).getFullYear(); if (y < 100) y += 2000;
      let d = new Date(y, m[2] - 1, +m[1]); if (!m[3] && iso(d) < t) d = new Date(y + 1, m[2] - 1, +m[1]); due = iso(d);
    } else if ((m = n.match(new RegExp("\\b(\\d{1,2})\\s*(?:de\\s*)?(" + MN.join("|") + ")[a-z]*\\b")))) {
      const y = parse(t).getFullYear(); let d = new Date(y, MN.indexOf(m[2]), +m[1]); if (iso(d) < t) d = new Date(y + 1, MN.indexOf(m[2]), +m[1]); due = iso(d);
    } else if ((m = n.match(new RegExp("\\b(" + WD.join("|") + ")\\b")))) {
      const want = WD.indexOf(m[1]); let d = addDays(t, 1); while (parse(d).getDay() !== want) d = addDays(d, 1); due = d;
    }
    if (/\btfg\b|tutor|defensa|deposito|estado del arte/.test(n)) area = "tfg";
    else if (/trabajo en grupo/.test(n)) area = "uni";
    else if (/\btrabajo\b|reunion|informe|jefe|cliente|turnos/.test(n)) area = "work";
    else if (/examen|parcial|practica|entrega|presentacion|asignatura|\btema\b|estudiar|matricula/.test(n)) area = "uni";
    else if (/\bpag(ar|o|os)\b|llamar|llamada|\bcita\b|medic|dentista|banco|recibo|factura|comprar|renovar|veterinari|seguro|hacienda|\bitv\b|\bbici\b|perro|pienso|cumple|regalo|devolver|reservar|alquiler|luz|agua|gimnasio|carrera|correos|paquete/.test(n)) area = "life";
    return { due, area };
  }

  // ---------- avisos del campus virtual (Moodle) ----------
  // "Las siguientes tareas vencerán en martes, 17 de noviembre de 2026. <tarea> Vencimiento: 11:59 PM ..."
  function parseCampus(raw) {
    const m = raw.match(/vencer[aá]n?\s+(?:en\s+|el\s+)?(?:[a-záéíóú]+,\s*)?(\d{1,2})\s+de\s+([a-záéíóú]+)(?:\s+de\s+(\d{4}))?\.?/i);
    if (!m) return null;
    const mi = MONL.indexOf(norm(m[2]));
    if (mi < 0) return null;
    const due = iso(new Date(m[3] ? +m[3] : parse(today()).getFullYear(), mi, +m[1]));
    const rest = raw.slice(m.index + m[0].length);
    const times = [...rest.matchAll(/vencimiento:\s*(\d{1,2}):(\d{2})\s*(am|pm)?/gi)].map((t) => {
      let h = +t[1]; const ap = (t[3] || "").toLowerCase();
      if (ap === "pm" && h < 12) h += 12; if (ap === "am" && h === 12) h = 0;
      return pad(h) + ":" + t[2];
    });
    const parts = rest.split(/vencimiento:\s*\d{1,2}:\d{2}\s*(?:am|pm)?/i).map((x) => x.replace(/\s+/g, " ").trim()).filter((x) => x && x.length < 250);
    if (!parts.length) return null;
    return parts.map((x, i) => {
      const k = x.match(/^(.*?)\s+en curso\s+\d{2}\/\d{2}\s+\d+\s+(.+)$/i);
      const title = k ? k[1] + " · " + k[2] : x;
      return { text: title + (times[i] ? " (hasta las " + times[i] + ")" : ""), due };
    });
  }
  function addCampus(items) {
    const w0 = monday(today());
    items.forEach((it) => { const p = makePlan(it.text, it.due, "uni"); state.plans.push(p); openPlan = p.id; });
    save(); $("text").value = ""; $("hint").textContent = DEFAULT_HINT; render();
    toast(items.length === 1 ? "Te he hecho un plan hasta el " + fmt(items[0].due) + "." : "Te he hecho " + items.length + " planes desde el aviso del campus.");
  }

  // ---------- exámenes y entregas: plan por pasos ----------
  const DEADLINE_RE = /examen|parcial|\bfinal\b|entrega|practica|presentacion|exposicion|memoria|defensa|deposito|trabajo final/;
  const isDeadline = (text) => DEADLINE_RE.test(norm(text));
  const kindOf = (text) => { const n = norm(text); return /examen|parcial|\bfinal\b/.test(n) ? "Examen" : /presentacion|exposicion|defensa/.test(n) ? "Presentación" : "Entrega"; };
  const METHOD = {
    "Examen": "Un tema por sesión: lee, haz un esquema y cierra con 3 preguntas de memoria. Al final, practica con exámenes de otros años y haz un repaso.",
    "Entrega": "Primero entender bien qué piden y apuntar dudas. Luego hacerlo en dos partes y dejar un día para revisar y entregar con calma.",
    "Presentación": "Guion primero, diapositivas después y al menos dos ensayos en voz alta."
  };
  function template(kind, temas) {
    if (kind === "Examen") {
      const t = []; for (let i = 1; i <= (temas || 4); i++) t.push("Estudiar tema " + i + " (esquema + preguntas)");
      return ["Organizar apuntes y ver qué entra"].concat(t, ["Hacer ejercicios o exámenes de otros años", "Repaso final"]);
    }
    if (kind === "Presentación") return ["Preparar el guion", "Hacer las diapositivas", "Ensayar en voz alta", "Ensayo final"];
    return ["Leer el enunciado y apuntar dudas", "Hacer la primera parte", "Hacer la segunda parte", "Revisar y entregar"];
  }
  // Reparte los pasos pendientes de forma uniforme entre "from" y el día antes de la fecha.
  function distribute(plan, from) {
    const t = today(); if (from < t) from = t;
    let end = addDays(plan.due, -1);
    if (end < from) end = plan.due < from ? from : plan.due;
    const days = []; for (let d = from; d <= end; d = addDays(d, 1)) days.push(d);
    const rest = plan.steps.filter((x) => !x.done);
    rest.forEach((st, i) => { st.day = days[Math.floor(i * days.length / rest.length)]; });
  }
  function cleanTitle(text) {
    let t = text;
    [/\s*(para\s+)?(el\s+|este\s+|pr[oó]ximo\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/i, /\s*pasado ma[ñn]ana/i, /\s*\bma[ñn]ana\b/i, /\s*\bhoy\b/i,
     /\s*(para\s+)?(el\s+|del?\s+)?\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?/i, /\s*(para\s+)?(el\s+)?\d{1,2}\s*(de\s*)?(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*/i, /\s*en \d+ d[ií]as?/i
    ].forEach((re) => { t = t.replace(re, ""); });
    t = t.replace(/\s+(para|el|la|de|del)\s*$/i, "").replace(/\s{2,}/g, " ").trim() || text.trim();
    return cap1(t);
  }
  function makePlan(title, due, area, kind) {
    kind = kind || kindOf(title);
    const plan = { id: uid(), title, due, area: area || "uni", kind, temas: kind === "Examen" ? 4 : null, created: today(), done: false,
      steps: template(kind, 4).map((n) => ({ id: uid(), name: n, day: null, done: false })) };
    distribute(plan, today());
    return plan;
  }
  const findPlan = (id) => state.plans.find((x) => x.id === id);
  function planStatus(p) {
    const rest = p.steps.filter((x) => !x.done);
    if (rest.some((x) => x.day < today())) return ["late", "Atrasado"];
    const left = Math.max(1, diff(p.due));
    if (rest.length > left) return ["tight", "Va justo"];
    return ["ok", "Al día"];
  }

  // ---------- pintar ----------
  let openPlan = null, editPlan = null, delArmed = null;
  let openId = null, editId = null, splitId = null, pickerOpen = false, areaFilter = "all";
  const inFilter = (n) => areaFilter === "all" || (areaFilter === "none" ? !n.area : n.area === areaFilter);
  let composeArea = null, areaTouched = false, dueTouched = false;

  function render() {
    const t = today(), d = new Date(), w0 = monday(t), c0 = colorOf(w0);
    $("today").textContent = DOWL[d.getDay()] + " " + d.getDate() + " de " + MONL[d.getMonth()];
    const pending = state.notes.filter((n) => !n.done);
    const oldest = pending.reduce((a, n) => (!a || n.week < a ? n.week : a), null);
    const oldAge = oldest ? weeksAgo(oldest) : 0;
    $("summary").innerHTML = !pending.length ? "La pared está vacía. Pega tu primer pósit." :
      "Tienes <b>" + pending.length + (pending.length === 1 ? " pósit" : " pósits") + "</b> en la pared." +
      (oldAge >= 1 ? " El más antiguo lleva <b>" + oldAge + (oldAge === 1 ? " semana" : " semanas") + "</b>." : " Todos son de esta semana.");
    $("weekBtn").innerHTML = '<span class="swatch" style="--c:' + c0.c + '"></span> Esta semana: ' + c0.name;
    $("weekBtn").setAttribute("aria-expanded", pickerOpen);
    $("picker").hidden = !pickerOpen;
    $("picker").innerHTML = '<span class="small muted">Si en papel usas otro color esta semana, elígelo:</span>' +
      COLORS.map((c, i) => '<button type="button" data-pick="' + i + '" style="--c:' + c.c + '" aria-label="' + c.name + '" aria-pressed="' + (i === colorIdx(w0)) + '"></button>').join("");
    $("sample").hidden = !state.sample;
    renderToday(); renderPlans(); renderFilter(); renderSoon(); renderWall(); renderDone();
  }

  function renderFilter() {
    const pending = state.notes.filter((n) => !n.done);
    const opts = [["all", "Todo", pending.length]].concat(Object.keys(AREA).map((a) => [a, AREA[a], pending.filter((n) => n.area === a).length]))
      .concat([["none", "Sin área", pending.filter((n) => !n.area).length]]).filter((o) => o[0] === "all" || o[2] > 0 || o[0] === areaFilter);
    $("filter").hidden = opts.length <= 2;
    $("filter").innerHTML = opts.map(([k, l, c]) => '<button type="button" class="chip" data-filter="' + k + '" aria-pressed="' + (areaFilter === k) + '">' + l + " · " + c + "</button>").join("");
  }

  function renderSoon() {
    const list = state.notes.filter((n) => !n.done && inFilter(n) && n.due && diff(n.due) <= 10).sort((a, b) => a.due.localeCompare(b.due));
    $("soon").hidden = !list.length;
    $("soon").innerHTML = '<div class="label">Con fecha cerca</div>' + list.map((n) => {
      const k = diff(n.due);
      const when = k < 0 ? "Se pasó" : k === 0 ? "Hoy" : k === 1 ? "Mañana" : cap1(fmt(n.due));
      return '<div class="soon-row"><span class="d' + (k < 0 ? " late" : "") + '">' + when + '</span><span class="swatch" style="--c:' + colorOf(n.week).c + '"></span><span class="t">' + esc(n.text) + "</span></div>";
    }).join("");
  }

  function noteHTML(n) {
    const c = colorOf(n.week).c;
    const meta = [];
    if (n.area) meta.push("<span>" + AREA[n.area] + "</span>");
    if (n.due) { const k = diff(n.due); meta.push('<span class="' + (k < 0 ? "due-late" : "due") + '">' + (k < 0 ? "se pasó · " : k === 0 ? "hoy · " : k === 1 ? "mañana · " : "") + fmt(n.due) + "</span>"); }
    let body;
    if (editId === n.id) {
      body = '<textarea id="editText" aria-label="Texto">' + esc(n.text) + "</textarea>" +
        '<div class="opts">' + Object.keys(AREA).map((a) => '<button type="button" class="chip" data-editarea="' + a + '" aria-pressed="' + (n.area === a) + '">' + AREA[a] + "</button>").join("") + "</div>" +
        '<label class="lbl">Fecha (opcional)<input type="date" id="editDue" value="' + (n.due || "") + '"></label>' +
        '<div class="note-actions"><button class="done" type="button" data-save="' + n.id + '">Guardar</button><button type="button" data-cancel="1">Cancelar</button></div>';
    } else if (splitId === n.id) {
      body = '<div class="txt">' + esc(n.text) + "</div>" +
        '<label class="lbl">Un trozo pequeño por línea. Se quedan con el color de su semana.<textarea id="splitText" placeholder="Leer el enunciado&#10;Hacer el ejercicio 1&#10;…"></textarea></label>' +
        '<div class="note-actions"><button class="done" type="button" data-dosplit="' + n.id + '">Partir</button><button type="button" data-cancel="1">Cancelar</button></div>';
    } else {
      body = '<div class="txt">' + esc(n.text) + "</div>" + (meta.length ? '<div class="meta">' + meta.join("") + "</div>" : "") +
        (openId === n.id ? '<div class="note-actions"><button class="done" type="button" data-done="' + n.id + '">Hecho, lo arranco</button><button type="button" data-edit="' + n.id + '">Editar</button><button type="button" data-split="' + n.id + '">Partir en pequeños</button><button type="button" data-toss="' + n.id + '">Ya no lo haré</button></div>' : "");
    }
    const open = openId === n.id || editId === n.id || splitId === n.id;
    return '<div class="note' + (open ? " open" : "") + '" id="n-' + n.id + '" style="--c:' + c + ";--r:" + rot(n.id) + 'deg"' +
      (open ? "" : ' role="button" tabindex="0" data-open="' + n.id + '" aria-label="' + esc(n.text) + '"') + ">" + body + "</div>";
  }

  function renderWall() {
    const pending = state.notes.filter((n) => !n.done && inFilter(n));
    if (!pending.length) {
      if (areaFilter !== "all") { $("wall").innerHTML = '<div class="empty"><span>Nada pendiente aquí.</span></div>'; return; }
      $("wall").innerHTML = '<div class="empty"><b>Pared limpia</b><span>Cuando algo te ronde la cabeza, escríbelo arriba y pégalo.</span></div>';
      return;
    }
    const weeks = [...new Set(pending.map((n) => n.week))].sort();
    $("wall").innerHTML = weeks.map((wk) => {
      const ns = pending.filter((n) => n.week === wk).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
      const age = weeksAgo(wk), col = colorOf(wk), d = parse(wk);
      return '<div class="week"><div class="week-head"><span class="swatch" style="--c:' + col.c + '"></span><h2>' + (age === 0 ? "Esta semana" : "Semana del " + d.getDate() + " " + MON[d.getMonth()]) + "</h2>" +
        '<span class="age' + (age >= 2 ? " old" : "") + '">' + (age === 0 ? ns.length + (ns.length === 1 ? " pósit" : " pósits") : (ns.length === 1 ? "lleva " : "llevan ") + age + (age === 1 ? " semana" : " semanas")) + "</span></div>" +
        '<div class="notes">' + ns.map(noteHTML).join("") + "</div></div>";
    }).join("");
  }

  function renderToday() {
    const t = today(), open = state.plans.filter((p) => !p.done);

    if (!open.length) return;
    const rows = [];
    open.forEach((p) => p.steps.forEach((st) => { if (st.day && (st.day < t ? !st.done : st.day === t)) rows.push({ p, st }); }));
    rows.sort((a, b) => a.st.day.localeCompare(b.st.day) || a.p.due.localeCompare(b.p.due));

    if (!rows.length) html += '<p class="calm">Hoy no tienes pasos de exámenes ni entregas. Descansa o adelanta algo si te apetece.</p>';

        '<div><div class="what">' + esc(st.name) + '</div><div class="why">' + esc(p.title) + " · " + (k === 0 ? "es hoy" : k === 1 ? "es mañana" : "faltan " + k + " días") + (st.day < t ? " · <b>era del " + fmt(st.day) + "</b>" : "") + "</div></div></div>";
    }).join("");
    if (late.length) html += '<p class="calm">' + (late.length === 1 ? "Un paso se quedó" : late.length + " pasos se quedaron") + " sin hacer otros días. No pasa nada: los reparto de nuevo en los días que quedan.</p>" +
      '<div class="row-btns"><button class="btn primary sm" type="button" data-replanall="today">Replanificar desde hoy</button></div>';
    else if (todayPending.length) html += '<div class="row-btns"><button class="btn sm" type="button" data-replanall="tomorrow">Hoy no he podido: muévelo a otros días</button></div>';

  }

  function renderPlans() {

          '<label class="lbl small muted" style="display:grid;gap:4px">Título<input type="text" id="peTitle" value="' + esc(p.title) + '" style="background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:7px 9px;height:38px"></label>' +
          '<label class="lbl small muted" style="display:grid;gap:4px">Fecha<input type="date" id="peDue" value="' + p.due + '" style="-webkit-appearance:none;appearance:none;display:block;background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:7px 9px;height:38px;max-width:220px"></label>' +
          (p.kind === "Examen" && !p.steps.some((x) => x.done) ? '<label class="small muted" style="display:flex;gap:8px;align-items:center">¿Cuántos temas entran? <input type="number" id="peTemas" min="1" max="30" value="' + (p.temas || 4) + '" style="width:70px;background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:6px 8px"></label>' : "") +
          '<div class="small muted">Pasos (puedes cambiar el texto y el día):</div>' +

          p.steps.map((st) => { const dd = st.day ? diff(st.day) : null;
            return '<div class="pstep' + (st.done ? " done" : "") + '"><button class="check sm" type="button" data-step="' + p.id + ":" + st.id + '" aria-pressed="' + st.done + '" aria-label="Hecho">' + (st.done ? "✓" : "") + '</button><span class="n">' + esc(st.name) + '</span><span class="d' + (!st.done && dd < 0 ? " late" : dd === 0 ? " today" : "") + '">' + (st.done ? "hecho" : dd === 0 ? "hoy" : dd === 1 ? "mañana" : fmt(st.day)) + "</span></div>"; }).join("") +

      }

        '<div class="plan-top"><span class="plan-title">' + esc(p.title) + '</span><span class="pill ' + cls + '">' + txt + "</span></div>" +
        '<div class="plan-sub"><span>' + p.kind + " · <b>" + (k < 0 ? "se pasó" : k === 0 ? "hoy" : k === 1 ? "mañana" : "en " + k + " días") + "</b> (" + fmt(p.due) + ")</span><span>" + dn + "/" + p.steps.length + " pasos</span>" +
        (next && !isOpen ? "<span>Siguiente: " + esc(next.name) + " · " + (next.day === today() ? "hoy" : next.day < today() ? "atrasado" : fmt(next.day)) + "</span>" : "") + "</div>" +
        '<div class="bar"><i style="width:' + Math.round(dn / Math.max(1, p.steps.length) * 100) + '%"></i></div></button>' + body + "</div>";
    }).join("");
  }

  // acciones de los planes
  let lastPlanDone = null;
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-step],[data-replan],[data-replanall],[data-popen],[data-peopen],[data-pesave],[data-pecancel],[data-peadd],[data-perm],[data-pedel],[data-pdone]");
    if (!el) return;
    const ds = el.dataset;
    if (ds.step) {
      const [pid, sid] = ds.step.split(":"), p = findPlan(pid), st = p.steps.find((x) => x.id === sid);
      st.done = !st.done; if (st.done) st.doneAt = today(); else delete st.doneAt;
      save(); render();
      if (st.done) { const left = p.steps.filter((x) => !x.done).length; toast(left ? "Hecho. Te quedan " + left + (left === 1 ? " paso" : " pasos") + " para esto." : "¡Plan completo! Solo queda entregarlo."); }
    }
    else if (ds.replan) { const p = findPlan(ds.replan); distribute(p, today()); save(); render(); toast("Replanificado: los pasos que quedan, repartidos hasta el " + fmt(addDays(p.due, -1)) + "."); }
    else if (ds.replanall) {
      const from = ds.replanall === "tomorrow" ? addDays(today(), 1) : today();
      state.plans.filter((p) => !p.done).forEach((p) => { if (p.steps.some((x) => !x.done && x.day <= (ds.replanall === "tomorrow" ? today() : addDays(today(), -1)))) distribute(p, from); });
      save(); render(); toast(ds.replanall === "tomorrow" ? "Movido a los próximos días. Mañana será otro día." : "Replanificado desde hoy.");
    }
    else if (ds.popen) { openPlan = openPlan === ds.popen && editPlan !== ds.popen ? null : ds.popen; editPlan = null; delArmed = null; render(); }
    else if (ds.peopen) { editPlan = ds.peopen; openPlan = ds.peopen; delArmed = null; render(); }
    else if (ds.pecancel) { editPlan = null; delArmed = null; render(); }
    else if (ds.peadd || ds.perm != null) {
      const p = findPlan(editPlan); readEdits(p);
      if (ds.peadd) p.steps.push({ id: uid(), name: "", day: addDays(p.due, -1) < today() ? today() : addDays(p.due, -1), done: false });
      else p.steps.splice(+ds.perm, 1);
      render();
    }
    else if (ds.pesave) {
      const p = findPlan(ds.pesave), oldDue = p.due, oldTemas = p.temas; readEdits(p);
      const tm = $("peTemas");
      if (tm && +tm.value !== oldTemas) { p.temas = Math.max(1, Math.min(30, +tm.value || 4)); p.steps = template(p.kind, p.temas).map((n) => ({ id: uid(), name: n, day: null, done: false })); distribute(p, today()); }
      else if (p.due !== oldDue) distribute(p, today());
      p.steps = p.steps.filter((x) => x.name.trim());
      editPlan = null; save(); render(); toast("Plan guardado.");
    }
    else if (ds.pedel) {
      if (delArmed !== ds.pedel) { delArmed = ds.pedel; render(); return; }
      state.plans = state.plans.filter((x) => x.id !== ds.pedel); editPlan = openPlan = delArmed = null; save(); render(); toast("Plan borrado.");
    }
    else if (ds.pdone) {
      const p = findPlan(ds.pdone); p.done = true; p.doneAt = today(); lastPlanDone = p.id; openPlan = null; save(); render();
      toastUndo("¡Entregado! Uno menos.", () => { const q = findPlan(lastPlanDone); if (q) { q.done = false; delete q.doneAt; save(); render(); } });
    }
  });
  function readEdits(p) {
    const ti = $("peTitle"), du = $("peDue");
    if (ti && ti.value.trim()) p.title = ti.value.trim();
    if (du && du.value) p.due = du.value;
    document.querySelectorAll("[data-pe]").forEach((inp) => { const st = p.steps[+inp.dataset.i]; if (!st || st.done) return; if (inp.dataset.pe === "name") st.name = inp.value; else if (inp.value) st.day = inp.value; });
  }

  function renderDone() {
    const w0 = monday(today());
    const done = state.notes.filter((n) => n.done && !n.tossed).sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || ""));
    const thisWeek = done.filter((n) => n.doneAt && n.doneAt >= w0).length;
    $("donebox").innerHTML = '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="big-count">' + thisWeek + '</span><span class="muted">' + (thisWeek === 1 ? "pósit arrancado esta semana" : "pósits arrancados esta semana") + "</span></div>" +
      (done.length ? '<details><summary>Ver los arrancados</summary><div style="display:grid;gap:8px;padding-top:10px">' +
        done.slice(0, 30).map((n) => '<div class="done-row"><span class="swatch" style="--c:' + colorOf(n.week).c + '"></span><span class="t">' + esc(n.text) + '</span><span class="xs">' + (n.doneAt ? fmt(n.doneAt) : "") + '</span><button class="link xs" type="button" data-undo="' + n.id + '">Volver a pegar</button></div>').join("") + "</div></details>" : "");
  }

  // ---------- escribir ----------
  const DEFAULT_HINT = "Solo hace falta el texto. También puedes pegar un aviso del campus virtual.";
  function syncOpts() { document.querySelectorAll("#opts [data-area]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.area === composeArea)); }
  function updateHint() {
    const bits = [];
    if (composeArea) bits.push(AREA[composeArea]);
    if ($("due").value) bits.push("para el " + fmt($("due").value));
    const willPlan = $("due").value && isDeadline($("text").value) && composeArea !== "life";
    $("hint").textContent = willPlan ? "Es un " + kindOf($("text").value).toLowerCase() + ": te haré un plan por pasos hasta el " + fmt($("due").value) + "." :
      bits.length ? "Lo pego como: " + bits.join(" · ") + ". Puedes cambiarlo." : DEFAULT_HINT;
  }
  $("text").addEventListener("paste", (e) => {
    const raw = (e.clipboardData || window.clipboardData)?.getData("text") || "";
    const items = parseCampus(raw);
    if (items) { e.preventDefault(); addCampus(items); }
  });
  $("text").addEventListener("input", () => {
    const g = guess($("text").value);
    if (!areaTouched) { composeArea = g.area; syncOpts(); }
    if (!dueTouched) $("due").value = g.due || "";
    updateHint();
  });
  $("opts").addEventListener("click", (e) => {
    const b = e.target.closest("[data-area]"); if (!b) return;
    areaTouched = true; composeArea = composeArea === b.dataset.area ? null : b.dataset.area; syncOpts(); updateHint();
  });
  $("due").addEventListener("change", () => { dueTouched = true; updateHint(); });
  $("compose").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("text").value.trim(); if (!text) { $("text").focus(); return; }
    const campus = parseCampus(text);
    if (campus) { addCampus(campus); return; }
    const dueV = $("due").value;
    if (dueV && isDeadline(text) && composeArea !== "life") {
      const p = makePlan(cleanTitle(text), dueV, composeArea || "uni"); state.plans.push(p); openPlan = p.id; save();
      $("text").value = ""; $("due").value = ""; composeArea = null; areaTouched = false; dueTouched = false; syncOpts();
      $("hint").textContent = DEFAULT_HINT; render();
      toast("Te he hecho un plan de " + p.steps.length + " pasos hasta el " + fmt(dueV) + ". Revísalo abajo.");
      const el = $("plan-" + p.id); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }
    state.notes.push({ id: uid(), text, week: monday(today()), created: today(), area: composeArea, due: $("due").value || null, done: false });
    save();
    $("text").value = ""; $("due").value = ""; composeArea = null; areaTouched = false; dueTouched = false; syncOpts();
    $("hint").textContent = DEFAULT_HINT;
    render(); toast("Pegado.");
  });

  // ---------- tocar pósits ----------
  let lastDone = null, tT;
  const find = (id) => state.notes.find((x) => x.id === id);
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-open],[data-done],[data-edit],[data-split],[data-toss],[data-save],[data-cancel],[data-dosplit],[data-editarea],[data-undo],[data-pick],[data-filter]");
    if (!el) {
      if (openId && !e.target.closest(".note")) { openId = null; render(); }
      return;
    }
    const ds = el.dataset;
    if (ds.open) { openId = openId === ds.open ? null : ds.open; editId = splitId = null; render(); }
    else if (ds.done) {
      const n = find(ds.done), node = $("n-" + n.id);
      if (node) node.classList.add("peel");
      setTimeout(() => {
        n.done = true; n.doneAt = today(); lastDone = n.id; openId = null; save(); render();
        const age = weeksAgo(n.week);
        toast(age >= 2 ? "¡Por fin! Llevaba " + age + " semanas." : "Arrancado. Uno menos.", true);
      }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 320);
    }
    else if (ds.edit) { editId = ds.edit; openId = splitId = null; render(); const t = $("editText"); if (t) t.focus(); }
    else if (ds.split) { splitId = ds.split; openId = editId = null; render(); const t = $("splitText"); if (t) t.focus(); }
    else if (ds.toss) {
      const n = find(ds.toss); n.done = true; n.tossed = true; n.doneAt = today(); lastDone = n.id; openId = null; save(); render();
      toast("Despegado. Decidir no hacerlo también cuenta.", true);
    }
    else if (ds.editarea) {
      const n = find(editId); n.area = n.area === ds.editarea ? null : ds.editarea;
      document.querySelectorAll("[data-editarea]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.editarea === n.area));
    }
    else if (ds.save) {
      const n = find(ds.save), txt = $("editText").value.trim();
      if (txt) n.text = txt; n.due = $("editDue").value || null;
      editId = null; save(); render(); toast("Guardado.");
    }
    else if (ds.dosplit) {
      const n = find(ds.dosplit);
      const lines = $("splitText").value.split("\n").map((s) => s.trim()).filter(Boolean);
      if (!lines.length) { $("splitText").focus(); return; }
      lines.forEach((l) => state.notes.push({ id: uid(), text: l, week: n.week, created: today(), area: n.area, due: n.due, done: false, from: n.id }));
      n.done = true; n.tossed = true; n.doneAt = today(); splitId = null; save(); render();
      toast("Partido en " + lines.length + " pósits. Siguen con su color.");
    }
    else if (ds.cancel) { editId = splitId = null; render(); }
    else if (ds.undo) { const n = find(ds.undo); n.done = false; delete n.tossed; delete n.doneAt; save(); render(); toast("Vuelve a estar en la pared."); }
    else if (ds.filter) { areaFilter = ds.filter; openId = editId = splitId = null; render(); }
    else if (ds.pick != null) { state.weekColor[monday(today())] = +ds.pick; save(); render(); }
  });
  document.addEventListener("keydown", (e) => {
    const el = e.target.closest && e.target.closest("[data-open]");
    if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); el.click(); }
  });
  $("weekBtn").onclick = () => { pickerOpen = !pickerOpen; render(); };
  $("clearSample").onclick = () => { state = { v: 3, sample: false, weekColor: {}, notes: [], plans: [], plansV: 1 }; save(); render(); toast("Listo. Tu pared está vacía."); $("text").focus(); };

  function toastUndo(msg, fn) {
    const t = $("toast"); t.innerHTML = "<span>" + esc(msg) + '</span><button type="button" id="toastUndo2">Deshacer</button>';
    t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, 4500);
    $("toastUndo2").onclick = () => { fn(); t.hidden = true; };
  }
  // ---------- aviso con deshacer ----------
  function toast(msg, undo) {
    const t = $("toast");
    t.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? '<button type="button" id="toastUndo">Deshacer</button>' : "");
    t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, undo ? 4500 : 2200);
    if (undo) $("toastUndo").onclick = () => {
      const n = find(lastDone); if (n) { n.done = false; delete n.tossed; delete n.doneAt; save(); render(); }
      t.hidden = true;
    };
  }

  // ---------- copia de seguridad ----------
  $("exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "mi-pared-" + today() + ".json";
    document.body.appendChild(a); a.click(); a.remove(); toast("Copia guardada.");
  };
  $("importFile").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const s = JSON.parse(r.result); if (s.v !== 3 || !Array.isArray(s.notes)) throw 0; state = s; if (!Array.isArray(state.plans)) state.plans = []; save(); render(); toast("Copia recuperada."); } catch (err) { toast("Ese archivo no es una copia de tu pared."); } };
    r.readAsText(f); e.target.value = "";
  };

  let lastDay = today();
  const refresh = () => { if (today() !== lastDay) { lastDay = today(); render(); } };
  setInterval(refresh, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  migratePlans();
  render();
})();
</script>
</body>
</html>
